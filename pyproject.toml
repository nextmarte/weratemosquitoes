[project]
name = "aquiles"
version = "0.1.0"
description = "Auditable host-directed antiviral target triage for arboviruses, with an independent verifier."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio[mcp]>=5.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
aquiles = "aquiles.pipeline:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aquiles"]
